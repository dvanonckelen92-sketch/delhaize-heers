[build]
  command = "npm run build"
  publish = "dist"

# Canonieke domeinredirect: forceer www zodat er geen duplicate-content (SEO) ontstaat
# tussen het kale en het www-domein, ook als de DNS/domain-instellingen dit nog niet afdwingen.
[[redirects]]
  from = "https://delhaizeheers.be/*"
  to = "https://www.delhaizeheers.be/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
